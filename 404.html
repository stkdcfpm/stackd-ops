<title>Page not found — Stackd Ops</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
:root{--cr:#B8283A;--ink:#0f0c0d;--m:#8a7f82;--bg:#f8f5f3;--ln:#e8e0de;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
.logo-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:.14em;color:var(--ink);text-transform:uppercase;margin-bottom:28px;}
.logo-text span{color:var(--cr);}
.code{font-size:3rem;font-weight:500;color:var(--cr);letter-spacing:.04em;line-height:1;}
h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.04em;margin:14px 0 8px;}
p{color:var(--m);font-size:.7rem;max-width:360px;line-height:1.7;margin-bottom:26px;}
a{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:white;background:var(--ink);border:1px solid var(--ink);padding:9px 20px;text-decoration:none;transition:opacity .15s;}
a:hover{opacity:.85;}
</style>
</head>
<body>
<div class="logo-text">STACK<span>D</span></div>
<div class="code">404</div>
